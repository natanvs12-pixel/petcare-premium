<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PetCare+ Premium</title>
<meta name="description" content="App premium para donos de pets: vacinas, banho/tosa, alimentação, lembretes, carteira digital, álbum, financeiro e receitas em um só lugar.">
<meta name="theme-color" content="#0EA5E9">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<!-- iOS standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PetCare+ Premium">

<!-- Android / outros -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="PetCare+ Premium">
<meta name="format-detection" content="telephone=no">

<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4f8;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Arial,sans-serif;color:#0f172a}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:#f8fafc;box-shadow:0 0 35px #0001;position:relative;padding-bottom:88px}
.center{display:flex;align-items:center;justify-content:center}
.p{padding:22px}
.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,#0ea5e9,#10b981);color:white;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 25px #0ea5e955;flex-shrink:0;position:relative}
.logo.big{width:78px;height:78px;border-radius:26px;font-size:42px}
.logo .badge{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#fde047,#f59e0b);color:#78350f;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid white}
.logo.big .badge{width:32px;height:32px;font-size:18px;top:-4px;right:-4px}

.brand{font-weight:900;font-size:22px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.brand .plus{color:#f97316}
.brand .premium-text{font-size:11px;background:linear-gradient(135deg,#fde047,#f59e0b);color:#78350f;padding:3px 8px;border-radius:999px;font-weight:900;letter-spacing:.3px}

.card{background:white;border:1px solid #e2e8f0;border-radius:24px;padding:18px;box-shadow:0 8px 22px #0f172a0a}
.btn{width:100%;border:0;border-radius:18px;padding:15px 18px;font-weight:800;font-size:15px;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:white;box-shadow:0 10px 18px #0ea5e933;cursor:pointer;font-family:inherit}
.btn.secondary{background:white;color:#0f172a;border:1px solid #dbe3ea;box-shadow:none}
.btn.orange{background:linear-gradient(135deg,#f97316,#ea580c)}
.btn.purple{background:linear-gradient(135deg,#8b5cf6,#6366f1);box-shadow:0 10px 18px #8b5cf633}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;box-shadow:0 12px 22px #f59e0b55;border:1px solid #f59e0b}
.btn.dark{background:linear-gradient(135deg,#1e293b,#0f172a);color:white}
.btn.qa{padding:12px 6px;font-size:12px;line-height:1.3;font-weight:800;min-height:64px}
.btn.danger{color:#dc2626}
.btn:disabled{opacity:.55}

input,select,textarea{width:100%;border:1px solid #dbe3ea;border-radius:16px;padding:14px;font-size:15px;outline:none;background:white;font-family:inherit}
textarea{min-height:70px;resize:vertical}
label{font-size:13px;font-weight:800;color:#475569;display:block;margin:14px 0 6px}

.hero{text-align:center;padding:45px 25px 25px}
.hero h1{font-size:24px;line-height:1.2;margin:14px 0 8px}
.hero .muted{font-size:14px}

.grad{background:linear-gradient(135deg,#0ea5e9,#10b981);color:white;border-radius:28px;padding:22px;overflow:hidden}
.grad-premium{background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 55%,#6d28d9 100%);color:white;border-radius:28px;padding:22px;overflow:hidden;position:relative}
.grad-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;border-radius:28px;padding:22px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}

.small{font-size:12px;color:#64748b}
.muted{color:#64748b}
.danger{color:#dc2626}

.top{position:sticky;top:0;z-index:5;background:#ffffffd9;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;padding:14px 18px;display:flex;gap:10px;align-items:center}
.back{width:36px;height:36px;border:0;border-radius:50%;background:#f1f5f9;font-size:20px;cursor:pointer;flex-shrink:0}
.crown{display:inline-block;background:linear-gradient(135deg,#fde047,#f59e0b);color:#78350f;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.4px;flex-shrink:0}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:white;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:repeat(6,1fr);padding:8px 2px;z-index:5}
.nav button{border:0;background:white;color:#64748b;font-size:10px;font-weight:800;padding:6px 2px;line-height:1.2;cursor:pointer;font-family:inherit}
.nav .active{color:#0ea5e9}
.icon{font-size:22px;display:block;margin-bottom:2px}

.pill{display:inline-block;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:11px;font-weight:900;padding:6px 10px}
.pill.green{background:#dcfce7;color:#166534}
.pill.amber{background:#fef3c7;color:#92400e}
.pill.red{background:#fee2e2;color:#991b1b}
.pill.gold{background:linear-gradient(135deg,#fde047,#f59e0b);color:#78350f}
.pill.purple{background:#ede9fe;color:#5b21b6}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:white;border:1px solid #e2e8f0;border-radius:18px;padding:14px}
.avatar{width:62px;height:62px;border-radius:20px;object-fit:cover;flex-shrink:0;background:#e2e8f0}
.avatar.lg{width:88px;height:88px;border-radius:26px}

.alert{background:#ecfdf5;color:#047857;border:1px solid #bbf7d0;border-radius:18px;padding:14px;font-weight:700;font-size:14px}
.alert.warn{background:#fffbeb;color:#b45309;border-color:#fde68a}
.alert.danger{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.alert.purple{background:#f5f3ff;color:#5b21b6;border-color:#ddd6fe}

.statCard{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:14px;cursor:pointer}
.statCard .small{margin-bottom:4px}
.statCard b{font-size:16px;display:block;margin:2px 0}

.empty{text-align:center;padding:38px 20px;color:#64748b}
.photo-prev{width:100%;max-height:240px;object-fit:cover;border-radius:14px;display:block}

.gIcon{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;color:white}
.gIcon.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f}
.gIcon.gray{background:#f1f5f9;color:#64748b}

.tabs{display:grid;gap:8px;margin:12px 0}
.tabs button{border:1px solid #dbe3ea;border-radius:14px;background:white;padding:12px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px}
.tabs.t2{grid-template-columns:1fr 1fr}
.tabs.t3{grid-template-columns:repeat(3,1fr)}
.tabs .on{background:#0ea5e9;color:white;border-color:#0ea5e9}
.tabs .on.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;border-color:#f59e0b}

.gallery-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.gallery-grid .gphoto{aspect-ratio:1;background:#e2e8f0;border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.gallery-grid .gphoto img{width:100%;height:100%;object-fit:cover;display:block}

.modal{position:fixed;inset:0;background:#000c;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;cursor:pointer}
.modal img{max-width:100%;max-height:90vh;border-radius:14px}

.divider{height:1px;background:#e2e8f0;margin:14px 0}

@media print{
  body{background:white}
  .app{box-shadow:none;padding-bottom:0;max-width:100%}
  .top,.nav,.no-print{display:none!important}
  .card,.grad,.grad-premium,.grad-gold{box-shadow:none!important;break-inside:avoid}
}

@media(min-width:800px){body{background:#e5edf3}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
/* ==========================================================================
   PetCare+ Premium - SPA single-file
   - LocalStorage key: petcare_plus_premium_v1
   - Sem dependências externas, sem backend, sem APIs
   - Todas as fotos são comprimidas para ~900px JPEG q=0.78 antes de salvar
   ========================================================================== */

const $=s=>document.querySelector(s);
const app=$('#app');
const K='petcare_plus_premium_v1';
const PHOTO='https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=500&q=80';

/* ============ STATE ============ */
let state=JSON.parse(localStorage.getItem(K)||'null')||{
  email:'',plan:'premium',pets:[],activePet:null,
  vaccines:[],grooming:[],food:{},reminders:[],gallery:[],expenses:[]
};
// Compatibilidade: garante que arrays existam (caso state tenha sido salvo antes)
['vaccines','grooming','reminders','gallery','expenses'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
if(!state.food||typeof state.food!=='object')state.food={};
state.plan='premium';

function save(){
  try{localStorage.setItem(K,JSON.stringify(state));return true}
  catch(e){
    alert('⚠️ Espaço cheio no celular. Tente apagar fotos antigas do álbum, registros antigos ou usar fotos menores.');
    return false;
  }
}

/* ============ HELPERS ============ */
function id(){return Math.random().toString(36).slice(2,9)}
function fmt(d){return d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—'}
function days(d){
  if(!d)return NaN;
  const t=new Date();t.setHours(0,0,0,0);
  const x=new Date(d+'T00:00:00');x.setHours(0,0,0,0);
  const diff=x.getTime()-t.getTime();
  if(diff===0)return 0;
  return diff>0?Math.ceil(diff/86400000):Math.floor(diff/86400000);
}
function money(v){return 'R$ '+(parseFloat(v)||0).toFixed(2).replace('.',',')}
function pet(){return state.pets.find(p=>p.id===state.activePet)||state.pets[0]}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function nl2br(s){return esc(s).replace(/\n/g,'<br>')}
function calcAge(birth){
  if(!birth)return null;
  const b=new Date(birth+'T00:00:00');const t=new Date();
  let y=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();
  if(m<0||(m===0&&t.getDate()<b.getDate()))y--;
  if(y<1){
    let months=(t.getFullYear()-b.getFullYear())*12+m;
    if(t.getDate()<b.getDate())months--;
    return months+' meses';
  }
  return y+(y===1?' ano':' anos');
}

/* ============ UI HELPERS ============ */
function logoEl(big){return `<div class="logo${big?' big':''}">🐾<span class="badge">+</span></div>`}
function brandEl(){return `<div class="brand">PetCare<span class="plus">+</span><span class="premium-text">PREMIUM</span></div>`}

function topbar(t,back='home()'){
  return `<div class="top">
    <button class="back" onclick="${back}">‹</button>
    <b style="font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t}</b>
    <span class="crown">👑 PREMIUM</span>
  </div>`;
}

function nav(active){
  const items=[
    ['home','🏠','Início','home()'],
    ['pets','🐶','Pets','pets()'],
    ['vac','💉','Vacinas','vaccines()'],
    ['groom','🛁','Banho','grooming()'],
    ['fin','💰','Financeiro','expenses()'],
    ['more','⋯','Mais','more()']
  ];
  return `<div class="nav">${items.map(([k,ic,nm,fn])=>`<button class="${active===k?'active':''}" onclick="${fn}"><span class="icon">${ic}</span>${nm}</button>`).join('')}</div>`;
}

/* ============ UPLOAD DE FOTOS (compressão para localStorage) ============ */
function compressImage(file,cb,maxSize=900,quality=0.78){
  if(!file)return;
  if(file.size>15*1024*1024){alert('Foto muito grande. Use uma menor que 15MB.');return}
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h&&w>maxSize){h=h*maxSize/w;w=maxSize}
      else if(h>maxSize){w=w*maxSize/h;h=maxSize}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',quality));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ LOGIN ============ */
function login(){
  app.innerHTML=`<div class="hero">
    ${logoEl(true)}
    <div class="brand" style="margin-top:14px;justify-content:center">PetCare<span class="plus">+</span><span class="premium-text">PREMIUM</span></div>
    <span class="crown" style="margin-top:14px">👑 EXCLUSIVO PREMIUM</span>
    <h1 style="margin-top:24px">Área Premium para Assinantes</h1>
    <p class="muted">Cuide de todos os seus pets em um só lugar, com recursos avançados para rotina, saúde, alimentação e controle de gastos.</p>
    <div class="card" style="text-align:left;margin-top:24px">
      <label>Digite seu e-mail de compra</label>
      <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
      <br><br>
      <button class="btn gold" onclick="doLogin()">👑 Acessar Plano Premium</button>
      <br><br>
      <button class="btn secondary" onclick="install()">📱 Como instalar no celular</button>
    </div>
  </div>`;
}
function doLogin(){
  const e=$('#email').value.trim().toLowerCase();
  if(!e.includes('@'))return alert('Digite um e-mail válido');
  state.email=e;save();
  if(!state.pets.length)register();else home();
}

/* ============ CADASTRO / EDIÇÃO DE PET ============ */
function register(editId){
  const p=editId?state.pets.find(x=>x.id===editId)||{}:{};
  const hasPhoto=p.photo&&p.photo.startsWith('data:');
  const isFirst=!state.pets.length;
  app.innerHTML=`${topbar(editId?'Editar pet':(isFirst?'Cadastrar primeiro pet':'Adicionar pet'),isFirst?'login()':'pets()')}
  <div class="p"><div class="card">
    <label>Nome do pet *</label>
    <input id="pName" value="${esc(p.name)}" placeholder="Ex: Thor">

    <label>Foto do pet</label>
    <input id="pPhotoFile" type="file" accept="image/*" onchange="prevPetPhoto(event)">
    <input type="hidden" id="pPhotoData" value="${hasPhoto?esc(p.photo):''}">
    <div id="pPhotoPrev" style="margin-top:10px">${hasPhoto?`<img src="${p.photo}" class="photo-prev"><br><button class="btn secondary" style="margin-top:8px" onclick="clearPetPhoto()">Remover foto</button>`:'<div class="small">Se não enviar, usaremos uma foto padrão.</div>'}</div>

    <label>Raça</label>
    <input id="pBreed" value="${esc(p.breed)}" placeholder="Ex: Golden Retriever, SRD">

    <div class="grid g2">
      <div><label>Idade</label><input id="pAge" value="${esc(p.age)}" placeholder="Ex: 2 anos"></div>
      <div><label>Peso (kg)</label><input id="pWeight" type="number" step="0.1" value="${esc(p.weight)}" placeholder="Ex: 12"></div>
    </div>

    <div class="grid g2">
      <div><label>Porte</label><select id="pSize">
        <option ${p.size==='Pequeno'?'selected':''}>Pequeno</option>
        <option ${!p.size||p.size==='Médio'?'selected':''}>Médio</option>
        <option ${p.size==='Grande'?'selected':''}>Grande</option>
      </select></div>
      <div><label>Sexo</label><select id="pSex">
        <option value="" ${!p.sex?'selected':''}>—</option>
        <option ${p.sex==='Macho'?'selected':''}>Macho</option>
        <option ${p.sex==='Fêmea'?'selected':''}>Fêmea</option>
      </select></div>
    </div>

    <label>Data de nascimento</label>
    <input id="pBirth" type="date" value="${esc(p.birthdate)}">

    <label>Alergias</label>
    <textarea id="pAllergies" placeholder="Ex: alergia a frango, pólen">${esc(p.allergies)}</textarea>

    <label>Personalidade</label>
    <textarea id="pPersonality" placeholder="Ex: brincalhão, dócil, tímido com estranhos">${esc(p.personality)}</textarea>

    <label>Medicamentos contínuos</label>
    <textarea id="pMeds" placeholder="Ex: Antialérgico 1x ao dia">${esc(p.medications)}</textarea>

    <label>Observações importantes</label>
    <textarea id="pObs" placeholder="Ex: medo de trovão, microchipado">${esc(p.observations)}</textarea>

    <br><br>
    <button class="btn gold" onclick="savePet('${editId||''}')">Salvar pet</button>
    ${editId?`<br><br><button class="btn secondary danger" onclick="deletePet('${editId}')">🗑️ Excluir este pet</button>`:''}
  </div></div>`;
}
function prevPetPhoto(e){
  compressImage(e.target.files[0],data=>{
    $('#pPhotoData').value=data;
    $('#pPhotoPrev').innerHTML=`<img src="${data}" class="photo-prev"><br><button class="btn secondary" style="margin-top:8px" onclick="clearPetPhoto()">Remover foto</button>`;
  });
}
function clearPetPhoto(){
  $('#pPhotoData').value='';
  const f=$('#pPhotoFile');if(f)f.value='';
  $('#pPhotoPrev').innerHTML='<div class="small">Se não enviar, usaremos uma foto padrão.</div>';
}
function savePet(editId){
  const name=$('#pName').value.trim();
  if(!name)return alert('Digite o nome do pet');
  const customPhoto=$('#pPhotoData').value;
  const obj={
    id:editId||id(),name,
    photo:customPhoto||PHOTO,
    breed:$('#pBreed').value.trim(),
    age:$('#pAge').value.trim(),
    weight:$('#pWeight').value.trim(),
    size:$('#pSize').value,
    sex:$('#pSex').value,
    birthdate:$('#pBirth').value,
    allergies:$('#pAllergies').value.trim(),
    personality:$('#pPersonality').value.trim(),
    medications:$('#pMeds').value.trim(),
    observations:$('#pObs').value.trim()
  };
  if(editId){state.pets=state.pets.map(p=>p.id===editId?obj:p)}
  else{state.pets.push(obj);state.activePet=obj.id}
  if(save())home();
}
function deletePet(petId){
  if(!confirm('Excluir este pet e TODOS os registros (vacinas, banhos, lembretes, álbum, gastos)?'))return;
  state.pets=state.pets.filter(p=>p.id!==petId);
  state.vaccines=state.vaccines.filter(v=>v.petId!==petId);
  state.grooming=state.grooming.filter(g=>g.petId!==petId);
  state.reminders=state.reminders.filter(r=>r.petId!==petId);
  state.gallery=state.gallery.filter(g=>g.petId!==petId);
  state.expenses=state.expenses.filter(e=>e.petId!==petId);
  if(state.food)delete state.food[petId];
  if(state.activePet===petId)state.activePet=state.pets[0]?state.pets[0].id:null;
  save();
  if(!state.pets.length)register();else pets();
}

/* ============ HOME / DASHBOARD ============ */
function home(){
  if(!state.email)return login();
  if(!state.pets.length)return register();
  const p=pet();

  const nextVac=[...state.vaccines.filter(v=>v.petId===p.id&&v.next)].sort((a,b)=>days(a.next)-days(b.next))[0];
  const nextGroom=[...state.grooming.filter(g=>g.petId===p.id&&g.next)].sort((a,b)=>days(a.next)-days(b.next))[0];
  const nextRem=[...state.reminders.filter(r=>r.petId===p.id&&!r.done&&r.date)].sort((a,b)=>days(a.date)-days(b.date))[0];

  const now=new Date();
  const ms=new Date(now.getFullYear(),now.getMonth(),1);
  const monthSpent=state.expenses.filter(e=>e.petId===p.id&&e.date&&new Date(e.date+'T00:00:00')>=ms).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);

  const ageDisplay=p.birthdate?calcAge(p.birthdate):(p.age||'idade não informada');

  const petSwitcher=state.pets.length>1?`<select onchange="switchPet(this.value)" style="background:#ffffff22;color:white;border:1px solid #ffffff44;border-radius:12px;padding:6px 10px;font-weight:800;font-size:12px;width:auto">${state.pets.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''} style="color:#0f172a">${esc(x.name)}</option>`).join('')}</select>`:'';

  app.innerHTML=`<div class="p">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <div style="display:flex;gap:10px;align-items:center">${logoEl()}${brandEl()}</div>
      <button class="back" onclick="settings()">⚙️</button>
    </div>

    <div class="grad-premium">
      <div style="position:absolute;top:-30px;right:-25px;font-size:140px;opacity:.07;line-height:1">✨</div>
      <div style="position:relative">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <span class="crown">👑 PREMIUM</span>
          ${petSwitcher}
        </div>

/* ============ VACINAS ============ */
function vaccines(){
  if(!state.email)return login();
  if(!state.pets.length)return register();
  const p=pet();
  const list=[...state.vaccines.filter(v=>v.petId===p.id)]
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const nextDays=v=>v.next?days(v.next):null;
  const statusOf=v=>{
    if(!v.next)return {pill:'Sem próxima',cls:''};
    const d=nextDays(v);
    if(d<0)return {pill:'Atrasada',cls:'red'};
    if(d<=15)return {pill:'Próxima',cls:'amber'};
    return {pill:'Em dia',cls:'green'};
  };
  const html=list.map(v=>{
    const st=statusOf(v);
    return `<div class="card">
      <div style="display:flex;gap:12px;align-items:flex-start">
        ${v.photo?`<img src="${v.photo}" style="width:62px;height:62px;border-radius:18px;object-fit:cover;flex-shrink:0">`:`<div class="gIcon">💉</div>`}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><b>${esc(v.name)}</b>${st.pill?`<span class="pill ${st.cls}">${st.pill}</span>`:''}</div>
          <div class="small" style="margin-top:2px">Aplicada: ${fmt(v.date)}</div>
          ${v.next?`<div class="small">Próxima: ${fmt(v.next)} ${nextDays(v)<0?'(há '+Math.abs(nextDays(v))+'d)':nextDays(v)===0?'(hoje!)':'(em '+nextDays(v)+'d)'}</div>`:''}
          ${v.clinic?`<div class="small" style="margin-top:2px">🏥 ${esc(v.clinic)}</div>`:''}
          ${v.obs?`<div class="small" style="margin-top:4px">${esc(v.obs)}</div>`:''}
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn secondary" style="font-size:12px;padding:10px;flex:1" onclick="vacForm('${v.id}')">✏️ Editar</button>
        <button class="btn secondary danger" style="font-size:12px;padding:10px;flex:1" onclick="delVac('${v.id}')">🗑️ Excluir</button>
      </div>
    </div>`;
  }).join('')||`<div class="empty">Nenhuma vacina cadastrada.<br>Toque em <b>+ Adicionar vacina</b>.</div>`;
  app.innerHTML=`${topbar('Carteira de Vacinação')}<div class="p">
    <button class="btn" onclick="vacForm()">+ Adicionar vacina</button>
    <div class="list" style="margin-top:14px">${html}</div>
  </div>${nav('vac')}`;
}

function grooming(){
  if(!state.email)return login();

  const p=pet();
  const recs=[...state.grooming.filter(g=>g.petId===p.id)].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const last=recs[0];
  const next=[...state.grooming.filter(g=>g.petId===p.id&&g.next)].sort((a,b)=>days(a.next)-days(b.next))[0];
  const nd=next?days(next.next):null;
  const now=new Date();const ms=new Date(now.getFullYear(),now.getMonth(),1);
  const monthSpent=state.grooming.filter(g=>g.petId===p.id&&g.date&&new Date(g.date+'T00:00:00')>=ms).reduce((s,g)=>s+(parseFloat(g.price)||0),0);
  let warn='';
  if(next){
    if(nd<0)warn=`<div class="alert danger">⚠️ Cuidado atrasado há ${Math.abs(nd)} dia(s).</div>`;
    else if(nd<=3)warn=`<div class="alert warn">🔔 Próximo cuidado ${nd===0?'é hoje!':'em '+nd+' dia(s)'}.</div>`;

    <div class="statCard"><div class="small">GASTO NO MÊS</div><b>${money(monthSpent)}</b></div>
  </div>`;
  const history=recs.map(g=>`<div class="card">
    <div style="display:flex;gap:12px;align-items:flex-start">
      ${g.photo?`<img src="${g.photo}" style="width:62px;height:62px;border-radius:18px;object-fit:cover;flex-shrink:0">`:`<div class="gIcon">🛁</div>`}
      <div style="flex:1;min-width:0">
        <b>${esc(g.type||'Banho')}</b>
        <div class="small">${fmt(g.date)} • ${esc(g.location||'—')}${g.place?' • '+esc(g.place):''}</div>

        ${g.next?`<div class="small">📅 Próximo: ${fmt(g.next)}</div>`:''}
        ${g.obs?`<div class="small" style="margin-top:4px">${esc(g.obs)}</div>`:''}
      </div>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px">
      <button class="btn secondary" style="font-size:12px;padding:10px;flex:1" onclick="groomingForm('${g.id}')">✏️ Editar</button>
      <button class="btn secondary danger" style="font-size:12px;padding:10px;flex:1" onclick="delGrooming('${g.id}')">🗑️ Excluir</button>
    </div>
  </div>`).join('')||`<div class="empty">Nenhum registro de banho/tosa ainda.</div>`;
  app.innerHTML=`${topbar('Banho / Tosa')}<div class="p">
    <button class="btn purple" onclick="groomingForm()">+ Novo registro</button>
    ${warn?'<br><br>'+warn:''}

    ${summary}

/* ============ LEMBRETES (com recorrência) ============ */
function reminders(tab){
  if(!state.email)return login();
  if(!state.pets.length)return register();
  const p=pet();
  tab=tab||'pending';
  const all=state.reminders.filter(r=>r.petId===p.id);
  const pending=all.filter(r=>!r.done).sort((a,b)=>days(a.date)-days(b.date));
  const done=all.filter(r=>r.done).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const items=tab==='pending'?pending:done;
  const typeIcon={vacina:'💉',banho:'🛁',remedio:'💊',ração:'🍽️',consulta:'🏥',outro:'🔔'};
  const repeatLabel={daily:'diário',weekly:'semanal',monthly:'mensal',yearly:'anual'};
  const html=items.map(r=>{
    const d=days(r.date);
    let badge='';
    if(!r.done){
      if(d<0)badge='<span class="pill red">Atrasado</span>';
      else if(d===0)badge='<span class="pill amber">Hoje</span>';

function remForm(editId){
  const r=editId?state.reminders.find(x=>x.id===editId)||{}:{};
  const types=[['vacina','💉 Vacina'],['banho','🛁 Banho'],['remedio','💊 Remédio'],['ração','🍽️ Ração'],['consulta','🏥 Consulta'],['outro','🔔 Outro']];
  const repeats=[['none','Não repetir'],['daily','Diário'],['weekly','Semanal'],['monthly','Mensal'],['yearly','Anual']];
  app.innerHTML=`${topbar(editId?'Editar lembrete':'Novo lembrete','reminders()')}<div class="p"><div class="card">
    <label>Título *</label><input id="rTitle" value="${esc(r.title)}" placeholder="Ex: Dar vermífugo">
    <label>Data *</label><input id="rDate" type="date" value="${esc(r.date||new Date().toISOString().slice(0,10))}">
    <label>Tipo</label><select id="rType">${types.map(([v,l])=>`<option value="${v}" ${r.type===v?'selected':''}>${l}</option>`).join('')}</select>
    <label>Repetição</label><select id="rRepeat">${repeats.map(([v,l])=>`<option value="${v}" ${(r.repeat||'none')===v?'selected':''}>${l}</option>`).join('')}</select>
    <label>Observação</label><textarea id="rObs" placeholder="Ex: dose de 10kg">${esc(r.obs)}</textarea>
    <br><br>
    <button class="btn orange" onclick="saveRem('${editId||''}')">Salvar lembrete</button>
  </div></div>`;
}
function saveRem(editId){
  const title=$('#rTitle').value.trim();const date=$('#rDate').value;
  if(!title)return alert('Digite o título');
  if(!date)return alert('Informe a data');
  const obj={id:editId||id(),petId:pet().id,title,date,type:$('#rType').value,repeat:$('#rRepeat').value,obs:$('#rObs').value.trim(),done:false};
  if(editId){
    const old=state.reminders.find(x=>x.id===editId);
    if(old)obj.done=old.done;
    state.reminders=state.reminders.map(x=>x.id===editId?obj:x);
  }else state.reminders.push(obj);
  if(save())reminders();
}
function toggleRem(i){
  const r=state.reminders.find(x=>x.id===i);
  if(!r)return;
  // Marcando como feito + recorrência: cria automaticamente o próximo
  if(!r.done&&r.repeat&&r.repeat!=='none'){
    const next=new Date(r.date+'T00:00:00');
    if(r.repeat==='daily')next.setDate(next.getDate()+1);
    else if(r.repeat==='weekly')next.setDate(next.getDate()+7);
    else if(r.repeat==='monthly')next.setMonth(next.getMonth()+1);
    else if(r.repeat==='yearly')next.setFullYear(next.getFullYear()+1);
    state.reminders.push({...r,id:id(),date:next.toISOString().slice(0,10),done:false});
  }
  r.done=!r.done;
  save();reminders();
}
function delRem(i){if(!confirm('Excluir este lembrete?'))return;state.reminders=state.reminders.filter(r=>r.id!==i);save();reminders()}

function logout(){if(confirm('Sair do app? Seus dados continuam salvos no celular.')){state.email='';save();login()}}
function wipeAll(){
  if(!confirm('Tem CERTEZA? Isso apaga todos os pets, vacinas, banhos, álbum, financeiro e configurações.'))return;
  if(!confirm('Última confirmação. Esta ação NÃO pode ser desfeita.'))return;
  localStorage.removeItem(K);
  state={email:'',plan:'premium',pets:[],activePet:null,vaccines:[],grooming:[],food:{},reminders:[],gallery:[],expenses:[]};
  login();
}

/* ============ EXPORT / IMPORT ============ */
function exportBackup(){
  try{
    const payload={...state,_exportedAt:new Date().toISOString(),_appVersion:'petcare_plus_premium_v1'};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`petcare-premium-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),200);
  }catch(e){alert('Não foi possível gerar o backup.')}
}
function triggerImport(){const f=$('#importFile');if(f)f.click()}
function importBackup(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imp=JSON.parse(ev.target.result);
      if(typeof imp!=='object'||imp===null||!Array.isArray(imp.pets)){
        alert('Arquivo inválido. Selecione um backup PetCare+.');e.target.value='';return;
      }
      const resumo=`Restaurar este backup?\n\n${imp.pets.length} pet(s)\n${(imp.vaccines||[]).length} vacina(s)\n${(imp.grooming||[]).length} banho(s)/tosa(s)\n${(imp.reminders||[]).length} lembrete(s)\n${(imp.gallery||[]).length} foto(s)\n${(imp.expenses||[]).length} despesa(s)\n\nOs dados atuais serão substituídos.`;
      if(!confirm(resumo)){e.target.value='';return}
      const pets=imp.pets||[];
      let active=imp.activePet||imp.active;
      if(!pets.find(p=>p.id===active))active=pets[0]?pets[0].id:null;
      const novo={
        email:imp.email||state.email,plan:'premium',pets,activePet:active,
        vaccines:Array.isArray(imp.vaccines)?imp.vaccines:[],
        grooming:Array.isArray(imp.grooming)?imp.grooming:[],
        food:imp.food&&typeof imp.food==='object'?imp.food:{},
        reminders:Array.isArray(imp.reminders)?imp.reminders:[],
        gallery:Array.isArray(imp.gallery)?imp.gallery:[],
        expenses:Array.isArray(imp.expenses)?imp.expenses:[]
      };
      const backup=JSON.stringify(state);
      state=novo;
      try{
        save();e.target.value='';
        alert('✅ Backup restaurado com sucesso!');
        if(state.email&&state.pets.length)home();else if(state.email)register();else login();
      }catch(qe){
        state=JSON.parse(backup);
        alert('Espaço cheio. Tente em um aparelho com mais espaço.');e.target.value='';
      }
    }catch(err){alert('Erro ao ler o arquivo. Verifique se é um backup válido.');e.target.value=''}
  };
  reader.readAsText(file);
}
